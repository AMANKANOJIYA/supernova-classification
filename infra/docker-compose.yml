# CLAUDE.md §6 step 12: replay-mode Kafka pipeline. First creation of §9's
# `infra/` directory. Infra only -- Kafka/Redis/Postgres run as containers;
# the Python services (src/serve/replay.py, inference_worker.py, api.py) run
# directly on the host against these containers' published localhost ports,
# so iterating on them doesn't require rebuilding an image each time.
#
# Single-node KRaft Kafka (no ZooKeeper) -- this is local dev/replay-mode
# infra, not a production cluster, so a combined broker+controller node is
# the right scope.
#
# Dev-only credentials below (POSTGRES_PASSWORD). Override via a local .env
# (gitignored) for anything beyond a laptop.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: sn-classifier-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "sn-classifier-dev-cluster-01"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sn-classifier-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: sn-classifier-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sn_dev_only_password}
      POSTGRES_DB: ${POSTGRES_DB:-sn_classifier}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sn}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sn_classifier_pg_data:/var/lib/postgresql/data

volumes:
  sn_classifier_pg_data:
