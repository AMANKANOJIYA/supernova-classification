[project]
name = "sn-classifier"
version = "0.1.0"
description = "Multi-survey, multimodal transient supernova classifier (ELAsTiCC2 -> ZTF -> Fink stream)."
requires-python = ">=3.12,<3.13"
readme = "CLAUDE.md"

# Version bounds are minor-pinned (>=X.Y,<X.(Y+1)) rather than exact patch pins.
# Rationale documented in the Day-1 session report handed back to the user: CLAUDE.md
# §8 asks for a pinned stack but does not specify exact patch versions, and guessing
# patch numbers with confidence is worse than a narrow, reproducible range. Run
# `make setup` on Day 1 to resolve a lockfile (requirements-lock.txt) against these
# bounds — that lockfile, not this file, is the source of truth for exact versions.
dependencies = [
    # Modelling
    "torch>=2.5,<2.6",
    "lightning>=2.4,<2.5",
    # Config
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    # Dataframes
    "polars>=1.9,<1.13",
    "pandas>=2.2,<2.3",           # only where a library forces it, per CLAUDE.md §8
    "numpy>=1.26,<2.2",
    # Astro
    "astropy>=6.1,<7.1",
    "sncosmo>=2.10,<2.11",
    "dustmaps>=1.0,<1.1",
    # Features
    "light-curve>=0.9,<0.10",
    # Anomaly detection
    "coniferest>=0.0.15",
    # Streaming
    "confluent-kafka>=2.5,<2.6",
    "fink-client>=5.0",
    # State
    "redis>=5.0,<5.1",
    "psycopg[binary]>=3.2,<3.3",  # Postgres driver — implementation detail of the §8 "Postgres" choice
    # Serving
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",  # ASGI server needed to actually run FastAPI
    "onnxruntime>=1.19,<1.20",
    # Tracking / monitoring
    "mlflow>=2.17,<2.18",
    "prometheus-client>=0.21,<0.22",
    # Plotting — approved 2026-09-04 for src/eval/ figures and Gate A light-curve plots
    # (not listed in CLAUDE.md §8; the stack table has no plotting library despite
    # Deliverable 4 requiring figure output, so this was raised and confirmed in chat).
    "matplotlib>=3.9,<3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
